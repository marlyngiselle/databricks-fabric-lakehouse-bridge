<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Databricks and Fabric lakehouse bridge</title>
  <desc id="desc">Two stacks of data layers joined by a bridge arc that carries a contract, over a navy to blue gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f4d"/>
      <stop offset="1" stop-color="#2456c8"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#9cc0ff"/>
    </linearGradient>
    <linearGradient id="slabSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a6fe0"/>
      <stop offset="1" stop-color="#7ea6f5"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe0ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- left stack: the producing lakehouse -->
  <g transform="translate(640 0)">
    <path d="M0 214 L70 194 L140 214 L70 234 Z" fill="url(#slabSoft)" opacity="0.55"/>
    <path d="M0 214 L0 224 L70 244 L70 234 Z" fill="#0b1f4d" opacity="0.45"/>
    <path d="M140 214 L140 224 L70 244 L70 234 Z" fill="#0b1f4d" opacity="0.3"/>
    <path d="M0 184 L70 164 L140 184 L70 204 Z" fill="url(#slabSoft)" opacity="0.75"/>
    <path d="M0 184 L0 194 L70 214 L70 204 Z" fill="#0b1f4d" opacity="0.45"/>
    <path d="M140 184 L140 194 L70 214 L70 204 Z" fill="#0b1f4d" opacity="0.3"/>
    <path d="M0 154 L70 134 L140 154 L70 174 Z" fill="url(#slab)"/>
    <path d="M0 154 L0 164 L70 184 L70 174 Z" fill="#0b1f4d" opacity="0.45"/>
    <path d="M140 154 L140 164 L70 184 L70 174 Z" fill="#0b1f4d" opacity="0.3"/>
  </g>

  <!-- right stack: the consuming lake -->
  <g transform="translate(980 0)">
    <path d="M0 214 L70 194 L140 214 L70 234 Z" fill="url(#slabSoft)" opacity="0.55"/>
    <path d="M0 214 L0 224 L70 244 L70 234 Z" fill="#0b1f4d" opacity="0.45"/>
    <path d="M140 214 L140 224 L70 244 L70 234 Z" fill="#0b1f4d" opacity="0.3"/>
    <path d="M0 184 L70 164 L140 184 L70 204 Z" fill="url(#slabSoft)" opacity="0.75"/>
    <path d="M0 184 L0 194 L70 214 L70 204 Z" fill="#0b1f4d" opacity="0.45"/>
    <path d="M140 184 L140 194 L70 214 L70 204 Z" fill="#0b1f4d" opacity="0.3"/>
    <path d="M0 154 L70 134 L140 154 L70 174 Z" fill="url(#slab)" opacity="0.9"/>
    <path d="M0 154 L0 164 L70 184 L70 174 Z" fill="#0b1f4d" opacity="0.45"/>
    <path d="M140 154 L140 164 L70 184 L70 174 Z" fill="#0b1f4d" opacity="0.3"/>
  </g>

  <!-- bridge: deck, arc and hangers -->
  <path d="M710 150 Q880 20 1050 150" fill="none" stroke="url(#arc)" stroke-width="4" stroke-linecap="round"/>
  <path d="M710 150 L1050 150" fill="none" stroke="#cfe0ff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <g stroke="#cfe0ff" stroke-width="1.5" opacity="0.55">
    <line x1="760" y1="114" x2="760" y2="150"/>
    <line x1="810" y1="94" x2="810" y2="150"/>
    <line x1="950" y1="94" x2="950" y2="150"/>
    <line x1="1000" y1="114" x2="1000" y2="150"/>
  </g>

  <!-- the contract riding the arc -->
  <g transform="translate(862 54)">
    <rect x="0" y="0" width="36" height="46" rx="5" fill="#ffffff"/>
    <path d="M26 0 L36 10 L26 10 Z" fill="#cfe0ff"/>
    <rect x="7" y="16" width="22" height="3" rx="1.5" fill="#2456c8"/>
    <rect x="7" y="24" width="18" height="3" rx="1.5" fill="#5b8def"/>
    <rect x="7" y="32" width="22" height="3" rx="1.5" fill="#5b8def"/>
  </g>

  <!-- data flowing across the deck -->
  <g fill="#ffffff">
    <circle cx="760" cy="150" r="3.5" opacity="0.5"/>
    <circle cx="830" cy="150" r="4" opacity="0.7"/>
    <circle cx="930" cy="150" r="4" opacity="0.85"/>
    <circle cx="1000" cy="150" r="3.5" opacity="0.6"/>
  </g>

  <!-- wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="112" font-size="20" font-weight="600" letter-spacing="3" fill="#9cc0ff">DATABRICKS TO FABRIC</text>
    <text x="64" y="166" font-size="50" font-weight="700" letter-spacing="-1">Lakehouse Bridge</text>
    <text x="64" y="208" font-size="21" fill="#cfe0ff">Unity Catalog produces. OneLake consumes.</text>
    <text x="64" y="238" font-size="21" fill="#cfe0ff">Data contracts keep both sides honest.</text>
  </g>
</svg>

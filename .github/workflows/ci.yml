name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (fmt, validate, tflint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -diff infra

      - name: init
        run: terraform -chdir=infra init -backend=false -input=false

      - name: validate
        run: terraform -chdir=infra validate

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.60.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --chdir=infra --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  python:
    name: python (ruff, mypy, pytest, generated files)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e ".[dev]"

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest

      - name: contracts are valid
        run: dctl validate

      # Expectations, DDL, TMDL and docs are committed. A contract change without
      # the regenerated files fails here.
      - name: generated files are up to date
        run: dctl generate --check

  contract-gate:
    name: breaking change gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e .

      - name: compare contracts with the target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: dctl check-breaking --base-ref "origin/${BASE_REF}"

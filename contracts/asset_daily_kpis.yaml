apiVersion: datacontract/v1
kind: DataContract
id: asset_daily_kpis
version: 1.2.0
status: active
domain: operations
description: >-
  One row per production asset and calendar day with availability, performance,
  quality rate and overall equipment effectiveness (OEE). The reference table for
  plant performance reporting.
owner:
  team: Plant Operations Analytics
  group: dp-operations-owners
  steward: dp-operations-stewards
table:
  schema: operations
  name: asset_daily_kpis
  primary_key: [asset_id, kpi_date]
  cluster_by: [site_code, kpi_date]
columns:
  - name: asset_id
    type: string
    nullable: false
    description: Business key of the production asset.
    classification: internal
    checks:
      pattern: "^AST-[0-9]{6}$"
  - name: site_code
    type: string
    nullable: false
    description: Code of the site that operates the asset.
    classification: internal
    checks:
      pattern: "^[A-Z]{3}[0-9]{2}$"
  - name: kpi_date
    type: date
    nullable: false
    description: Calendar day the KPIs refer to, in the site time zone.
    classification: internal
  - name: planned_runtime_min
    type: int
    nullable: false
    description: Minutes the asset was scheduled to run.
    classification: internal
    checks:
      min: 0
      max: 1440
  - name: run_time_min
    type: int
    nullable: false
    description: Minutes the asset actually ran.
    classification: internal
    checks:
      min: 0
      max: 1440
  - name: units_produced
    type: bigint
    nullable: false
    description: Units produced during the day, good and rejected.
    classification: internal
    checks:
      min: 0
  - name: units_rejected
    type: bigint
    nullable: false
    description: Units rejected by quality control.
    classification: internal
    checks:
      min: 0
  - name: availability
    type: double
    nullable: false
    description: Run time divided by planned runtime.
    classification: internal
    checks:
      min: 0
      max: 1
  - name: performance
    type: double
    nullable: false
    description: Actual output divided by theoretical output at nominal speed.
    classification: internal
    checks:
      min: 0
      max: 1
  - name: quality_rate
    type: double
    nullable: false
    description: Good units divided by units produced.
    classification: internal
    checks:
      min: 0
      max: 1
  - name: oee
    type: double
    nullable: false
    description: Availability times performance times quality rate.
    classification: internal
    checks:
      min: 0
      max: 1
  - name: updated_at
    type: timestamp
    nullable: false
    description: When the row was last written by the gold pipeline, in UTC.
    classification: internal
quality:
  - name: run_time_within_plan
    expression: run_time_min <= planned_runtime_min
    on_violation: drop
  - name: rejects_within_production
    expression: units_rejected <= units_produced
    on_violation: drop
  - name: oee_is_product_of_factors
    expression: abs(oee - availability * performance * quality_rate) < 0.001
    on_violation: warn
sla:
  freshness:
    column: updated_at
    max_delay_hours: 26
  update_frequency: daily
  availability_percent: 99.5
  retention_days: 1095
consumers:
  fabric:
    exposure: shortcut
    measures:
      - name: Average OEE
        expression: AVERAGE('asset_daily_kpis'[oee])
        format: 0.0%
      - name: Units Produced
        expression: SUM('asset_daily_kpis'[units_produced])
        format: "#,0"
      - name: Reject Rate
        expression: DIVIDE(SUM('asset_daily_kpis'[units_rejected]), SUM('asset_daily_kpis'[units_produced]))
        format: 0.00%

apiVersion: datacontract/v1
kind: DataContract
id: energy_consumption
version: 2.0.1
status: active
domain: energy
description: >-
  Hourly energy consumption per meter and energy carrier, with the associated
  greenhouse gas emissions in kilograms of CO2 equivalent. Feeds energy cost and
  decarbonisation reporting.
owner:
  team: Energy and Sustainability Data
  group: dp-energy-owners
  steward: dp-energy-stewards
table:
  schema: energy
  name: energy_consumption
  primary_key: [meter_id, reading_hour, energy_carrier]
  cluster_by: [site_code, reading_hour]
columns:
  - name: meter_id
    type: string
    nullable: false
    description: Business key of the energy meter.
    classification: internal
    checks:
      pattern: "^MTR-[0-9]{5}$"
  - name: reading_hour
    type: timestamp
    nullable: false
    description: Start of the hour the reading covers, in UTC.
    classification: internal
  - name: site_code
    type: string
    nullable: false
    description: Code of the site where the meter is installed.
    classification: internal
    checks:
      pattern: "^[A-Z]{3}[0-9]{2}$"
  - name: asset_id
    type: string
    nullable: true
    description: Asset the meter is attached to. Empty for site level meters.
    classification: internal
    checks:
      pattern: "^AST-[0-9]{6}$"
  - name: energy_carrier
    type: string
    nullable: false
    description: Form of energy measured by the meter.
    classification: internal
    checks:
      allowed_values: [electricity, natural_gas, steam, compressed_air]
  - name: consumption_kwh
    type: decimal(18,3)
    nullable: false
    description: Energy consumed during the hour, converted to kilowatt hours.
    classification: internal
    checks:
      min: 0
  - name: co2e_kg
    type: decimal(18,3)
    nullable: false
    description: Emissions for the hour in kilograms of CO2 equivalent.
    classification: internal
    checks:
      min: 0
  - name: emission_factor_version
    type: string
    nullable: false
    description: Version of the emission factor table used for the conversion.
    classification: internal
  - name: ingested_at
    type: timestamp
    nullable: false
    description: When the reading reached the gold table, in UTC.
    classification: internal
quality:
  - name: reading_not_in_future
    expression: reading_hour <= current_timestamp()
    on_violation: drop
  - name: emissions_need_consumption
    expression: co2e_kg = 0 OR consumption_kwh > 0
    on_violation: warn
sla:
  freshness:
    column: ingested_at
    max_delay_hours: 3
  update_frequency: hourly
  availability_percent: 99.5
  retention_days: 2555
consumers:
  fabric:
    exposure: shortcut
    measures:
      - name: Energy kWh
        expression: SUM('energy_consumption'[consumption_kwh])
        format: "#,0"
      - name: Emissions kg CO2e
        expression: SUM('energy_consumption'[co2e_kg])
        format: "#,0.0"
      - name: Electricity Share
        expression: DIVIDE(CALCULATE(SUM('energy_consumption'[consumption_kwh]), 'energy_consumption'[energy_carrier] = "electricity"), SUM('energy_consumption'[consumption_kwh]))
        format: 0.0%
